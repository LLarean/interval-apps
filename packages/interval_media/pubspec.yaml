name: interval_media
description: Music and media-session support for the interval apps — playlists per intensity, cross-fades and running with the screen off.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  audio_service: 0.18.19
  audio_session: ^0.2.4
  file_picker: 13.3.0
  flutter:
    sdk: flutter
  interval_kit:
    path: ../interval_kit
  just_audio: ^0.10.6
  path: ^1.9.1
  path_provider: 2.1.6

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter

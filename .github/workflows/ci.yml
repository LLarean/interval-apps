name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Check generated localizations are up to date
        run: |
          for dir in packages/interval_kit apps/tabata apps/walking; do
            (cd "$dir" && flutter gen-l10n)
          done
          git diff --exit-code

      - run: flutter analyze

      - name: Test
        run: |
          (cd packages/interval_core && dart test)
          for dir in packages/interval_kit apps/tabata apps/walking; do
            (cd "$dir" && flutter test)
          done

  build:
    name: Build ${{ matrix.app }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [tabata, walking]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Build APK
        run: flutter build apk --release
      - name: Build web
        run: flutter build web --release

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Check generated localizations are up to date
        run: |
          for dir in packages/interval_kit apps/tabata apps/walking; do
            (cd "$dir" && flutter gen-l10n)
          done
          git diff --exit-code

      - run: flutter analyze

      - name: Test
        run: |
          (cd packages/interval_core && dart test)
          for dir in packages/interval_kit packages/interval_media apps/tabata apps/walking; do
            (cd "$dir" && flutter test)
          done

  build:
    name: Build ${{ matrix.app }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [tabata, walking]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Build preview APK
        run: |
          flutter build apk --release -P preview=true
          mv build/app/outputs/flutter-apk/app-release.apk ${{ matrix.app }}-preview.apk
      - name: Build web
        run: flutter build web --release

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/${{ matrix.app }}-preview.apk
          retention-days: 14

  preview:
    name: Publish preview builds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-apk'
          merge-multiple: true

      # One release, replaced on every push, so the download links never change.
      - name: Replace the preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<NOTES
          Test builds of \`main\` at $GITHUB_SHA, for trying the apps before a store release.

          They install as separate apps — *Tabata Preview* and *Walking Preview* — next to the store versions, and each new preview updates the previous one. They are signed with a public test key: never upload them to a store.
          NOTES
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview *-preview.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Preview builds" \
            --notes-file notes.md

name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options: [Tabata Timer, Japanese Walking]
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and version
      placeholder: Android 15, app 2.0.0 / Chrome 140
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open settings
        2. Set rounds to 3
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true

name: tabata
description: Tabata interval timer.
publish_to: none
version: 2.0.0+2
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  interval_kit:
    path: ../../packages/interval_kit
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  interval_testing:
    path: ../../packages/interval_testing

flutter:
  generate: true
  uses-material-design: true

# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#F4EFEB"
  adaptive_icon_foreground: assets/icon/foreground.png
  web:
    generate: true
    background_color: "#F4EFEB"
    theme_color: "#405D26"
